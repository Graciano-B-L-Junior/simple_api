name: CI/CD

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["develop"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Atualizar o pip
        run: python -m pip install --upgrade pip

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Executar testes
        run: pytest -q

  deploy:
    name: Deploy na EC2
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: Atualizar aplicação na EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e

            if [ -z "${{ secrets.EC2_APP_DIR }}" ]; then
              echo "EC2_APP_DIR secret is not set. Configure it in the repository secrets before deploying." >&2
              exit 1
            fi

            cd "${{ secrets.EC2_APP_DIR }}"

            git fetch origin master
            git reset --hard origin/master

            .venv/bin/pip install -r requirements.txt
            .venv/bin/python manage.py migrate --noinput
            .venv/bin/python manage.py collectstatic --noinput

            sudo systemctl restart simple-api
            sudo systemctl is-active --quiet simple-api